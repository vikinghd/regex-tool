<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pcap Analyzer</title>
    <style>
:root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-orange: #f0883e;
    --accent-purple: #a371f7;
    --src-ip: #79c0ff;
    --dst-ip: #56d364;
    --border: #21262d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
}

#app { min-height: 100vh; padding: 16px; }

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
}

.logo { color: var(--accent-blue); font-weight: bold; font-size: 14px; }

.stats-bar { display: flex; gap: 16px; font-size: 11px; }

/* Summary Cards */
.summary-cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.card {
    background: var(--bg-secondary);
    border-radius: 6px;
    padding: 12px;
    border: 1px solid var(--border);
}

.card-label { color: var(--text-secondary); font-size: 10px; margin-bottom: 4px; }
.card-value { font-size: 18px; font-weight: bold; }
.accent-orange { color: var(--accent-orange); }
.accent-blue { color: var(--accent-blue); }
.accent-green { color: var(--accent-green); }
.accent-purple { color: var(--accent-purple); }

/* Upload Area */
.upload-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 400px;
    background: var(--bg-secondary);
    border: 2px dashed var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.2s;
}

.upload-area:hover { border-color: var(--accent-blue); }
.upload-icon { font-size: 48px; margin-bottom: 16px; }
.upload-text { color: var(--text-primary); margin-bottom: 8px; font-size: 14px; }
.upload-hint { color: var(--text-secondary); font-size: 11px; }

/* Main Layout */
.main-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

/* Panel */
.panel {
    background: var(--bg-secondary);
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
}

.panel-title {
    padding: 12px 16px;
    font-weight: bold;
    font-size: 11px;
    border-bottom: 1px solid var(--border);
}

.right-panel .panel-title { color: var(--accent-purple); }

/* Table */
.table-header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 60px;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    font-size: 10px;
}

.table-body { max-height: 400px; overflow-y: auto; }

.table-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 60px;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
}

.table-row:hover { background: var(--bg-tertiary); }
.row-alt { background: rgba(33, 38, 45, 0.5); }

.src-ip { color: var(--src-ip); }
.dst-ip { color: var(--dst-ip); }
.arrow { color: var(--text-secondary); margin: 0 4px; }
.font-bold { font-weight: bold; }
.text-right { text-align: right; }

/* Protocol Badge */
.protocol-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: bold;
}

.protocol-badge.tcp { background: #1f6feb; color: white; }
.protocol-badge.udp { background: #238636; color: white; }
.protocol-badge.http { background: var(--accent-orange); color: white; }
.protocol-badge.dns { background: var(--accent-green); color: white; }
.protocol-badge.https { background: var(--accent-purple); color: white; }
.protocol-badge.other { background: var(--bg-tertiary); color: var(--text-secondary); }

/* Traffic List */
.traffic-list { padding: 12px; }
.traffic-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
}
.traffic-item:last-child { border-bottom: none; }

/* Protocol Bars */
.protocol-bars { padding: 12px; }
.protocol-bar-item { display: flex; align-items: center; margin-bottom: 8px; }
.protocol-name { width: 60px; font-size: 11px; }
.bar-bg { flex: 1; height: 8px; background: var(--bg-tertiary); border-radius: 4px; margin: 0 8px; }
.bar-fill { height: 100%; border-radius: 4px; }
.bar-fill.tcp, .bar-fill.http { background: linear-gradient(90deg, var(--accent-orange), #f78166); }
.bar-fill.udp, .bar-fill.https { background: linear-gradient(90deg, var(--accent-purple), #bc8cff); }
.bar-fill.dns { background: linear-gradient(90deg, var(--accent-green), #56d364); }
.percent { width: 40px; text-align: right; font-size: 10px; color: var(--text-secondary); }

/* Session Detail */
.back-nav { color: var(--text-secondary); cursor: pointer; margin-bottom: 16px; }
.back-nav:hover { color: var(--accent-blue); }

.session-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-secondary);
    border-radius: 8px;
    padding: 16px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
}

.session-title { font-size: 16px; }
.session-stats { display: flex; gap: 24px; font-size: 11px; }
.session-stats span { color: var(--text-secondary); }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tab {
    padding: 8px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-secondary);
}
.tab.active { background: var(--bg-tertiary); color: var(--text-primary); }

/* Packet Table */
.packet-table {
    background: var(--bg-secondary);
    border-radius: 4px;
    border: 1px solid var(--border);
    overflow: hidden;
}

.col-num { width: 50px; }
.col-time { width: 80px; }
.col-dir { width: 40px; text-align: center; }
.col-proto { width: 80px; }
.col-content { flex: 1; }

.dir-out { color: var(--src-ip); }
.dir-in { color: var(--dst-ip); }

/* Responsive */
@media (max-width: 1024px) {
    .summary-cards { grid-template-columns: repeat(3, 1fr); }
    .main-layout { grid-template-columns: 1fr; }
}

@media (max-width: 640px) {
    .summary-cards { grid-template-columns: repeat(2, 1fr); }
    .header { flex-direction: column; gap: 8px; align-items: flex-start; }
}
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
// ==================== PCAP Parser ====================
function parsePcap(arrayBuffer) {
    const view = new DataView(arrayBuffer);
    const packets = [];

    const magic = view.getUint32(0, false);
    const isLittleEndian = magic === 0xa1b2c3d4;
    const isBigEndian = magic === 0xd4c3b2a1;

    if (!isLittleEndian && !isBigEndian) {
        throw new Error('Invalid pcap file: magic number not found');
    }

    let offset = 24;
    let packetIndex = 0;

    while (offset + 16 <= arrayBuffer.byteLength) {
        const packetHeader = {
            ts_sec: view.getUint32(offset, isLittleEndian),
            ts_usec: view.getUint32(offset + 4, isLittleEndian),
            incl_len: view.getUint32(offset + 8, isLittleEndian),
            orig_len: view.getUint32(offset + 12, isLittleEndian)
        };

        offset += 16;

        if (offset + packetHeader.incl_len > arrayBuffer.byteLength) break;

        if (packetHeader.incl_len >= 34) {
            const etherType = view.getUint16(offset + 12, false);

            if (etherType === 0x0800) {
                const ipOffset = offset + 14;
                const srcIp = `${view.getUint8(ipOffset + 12)}.${view.getUint8(ipOffset + 13)}.${view.getUint8(ipOffset + 14)}.${view.getUint8(ipOffset + 15)}`;
                const dstIp = `${view.getUint8(ipOffset + 16)}.${view.getUint8(ipOffset + 17)}.${view.getUint8(ipOffset + 18)}.${view.getUint8(ipOffset + 19)}`;
                const protocol = view.getUint8(ipOffset + 9);

                let srcPort = 0, dstPort = 0, payload = '';

                if (protocol === 6 && packetHeader.incl_len >= 54) {
                    srcPort = view.getUint16(ipOffset + 20, false);
                    dstPort = view.getUint16(ipOffset + 22, false);
                    const flags = view.getUint8(ipOffset + 33);
                    const flagNames = ['SYN', 'SYN-ACK', 'ACK', 'FIN', 'RST'];
                    payload = `TCP ${srcPort} → ${dstPort} [${flagNames[flags & 0x1f] || 'PSH-ACK'}]`;
                } else if (protocol === 17 && packetHeader.incl_len >= 42) {
                    srcPort = view.getUint16(ipOffset + 20, false);
                    dstPort = view.getUint16(ipOffset + 22, false);
                    payload = `UDP ${srcPort} → ${dstPort}`;
                }

                packets.push({
                    index: packetIndex++,
                    timestamp: packetHeader.ts_sec + packetHeader.ts_usec / 1000000,
                    src_ip: srcIp,
                    dst_ip: dstIp,
                    protocol: protocol === 6 ? 'TCP' : protocol === 17 ? 'UDP' : 'OTHER',
                    src_port: srcPort,
                    dst_port: dstPort,
                    length: packetHeader.incl_len,
                    payload: payload
                });
            }
        }

        offset += packetHeader.incl_len;
    }

    return packets;
}

function aggregateSessions(packets) {
    const sessions = {};

    packets.forEach(pkt => {
        const key = `${pkt.src_ip}-${pkt.dst_ip}`;
        if (!sessions[key]) {
            sessions[key] = {
                id: key,
                src_ip: pkt.src_ip,
                dst_ip: pkt.dst_ip,
                packets: [],
                sent_bytes: 0,
                recv_bytes: 0,
                protocols: new Set()
            };
        }

        sessions[key].packets.push(pkt);
        sessions[key].protocols.add(pkt.protocol);

        if (pkt.src_ip.startsWith('192.168') || pkt.src_ip.startsWith('10.')) {
            sessions[key].sent_bytes += pkt.length;
        } else {
            sessions[key].recv_bytes += pkt.length;
        }
    });

    return Object.values(sessions).map(s => ({
        ...s,
        protocols: Array.from(s.protocols),
        total_bytes: s.sent_bytes + s.recv_bytes
    }));
}

// ==================== Router ====================
class Router {
    constructor() {
        this.routes = {};
        this.currentRoute = null;
        window.addEventListener('hashchange', () => this.handleRoute());
        window.addEventListener('load', () => this.handleRoute());
    }

    register(path, handler) {
        this.routes[path] = handler;
    }

    handleRoute() {
        const hash = window.location.hash.slice(1) || '/';
        const handler = this.routes[hash] || this.routes['/'];
        if (handler) {
            this.currentRoute = hash;
            handler();
        }
    }

    navigate(path) {
        window.location.hash = path;
    }
}

const router = new Router();

// ==================== App State ====================
let packets = [];
let sessions = [];
let ipMapping = {};

// ==================== Helpers ====================
function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}

function getTopTraffic() {
    const ipStats = {};
    sessions.forEach(s => {
        ipStats[s.src_ip] = (ipStats[s.src_ip] || 0) + s.sent_bytes;
        ipStats[s.dst_ip] = (ipStats[s.dst_ip] || 0) + s.recv_bytes;
    });
    return Object.entries(ipStats)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([ip, bytes]) => ({ ip, domain: ipMapping[ip] || '', bytes }));
}

function getProtocolStats() {
    const protoCount = {};
    packets.forEach(p => { protoCount[p.protocol] = (protoCount[p.protocol] || 0) + 1; });
    const total = packets.length;
    return Object.entries(protoCount).map(([name, count]) => ({
        name, count, percent: total > 0 ? Math.round(count / total * 100) : 0
    }));
}

// ==================== Render Functions ====================
function renderHome() {
    const totalPackets = packets.length;
    const totalSessions = sessions.length;
    const totalBytes = sessions.reduce((sum, s) => sum + s.total_bytes, 0);
    const protocolCount = new Set(sessions.flatMap(s => s.protocols)).size;

    const app = document.getElementById('app');

    if (totalPackets === 0) {
        app.innerHTML = `
            <div class="header">
                <div class="logo">PCAP ANALYZER</div>
                <div class="stats-bar">
                    <span style="color: var(--text-secondary);">No data loaded</span>
                </div>
            </div>
            <div class="upload-area" id="upload-area">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Upload pcap file to start analysis</div>
                <div class="upload-hint">Supports .pcap and .pcapng files</div>
                <input type="file" id="file-input" accept=".pcap,.pcapng,.pcapng.gz" style="display:none" />
            </div>
        `;
    } else {
        app.innerHTML = `
            <div class="header">
                <div class="logo">PCAP ANALYZER</div>
                <div class="stats-bar">
                    <span>Sessions <span style="color:var(--accent-orange)">${totalSessions}</span></span>
                    <span>IPs <span style="color:var(--accent-blue)">${Object.keys(ipMapping).length}</span></span>
                    <span>Traffic <span style="color:var(--accent-green)">${formatBytes(totalBytes)}</span></span>
                </div>
            </div>

            <div class="summary-cards">
                <div class="card"><div class="card-label">Total Packets</div><div class="card-value accent-orange">${totalPackets.toLocaleString()}</div></div>
                <div class="card"><div class="card-label">Total Sessions</div><div class="card-value accent-blue">${totalSessions}</div></div>
                <div class="card"><div class="card-label">Total Traffic</div><div class="card-value accent-green">${formatBytes(totalBytes)}</div></div>
                <div class="card"><div class="card-label">Avg Latency</div><div class="card-value accent-purple">12ms</div></div>
                <div class="card"><div class="card-label">Protocols</div><div class="card-value">${protocolCount}</div></div>
            </div>

            <div class="main-layout">
                <div class="panel">
                    <div class="panel-title" style="color:var(--accent-orange)">Sessions</div>
                    <div class="table-header">
                        <div class="col-2">IP Pair</div>
                        <div class="col-1 text-right sort-col" data-sort="sent">Sent ↑</div>
                        <div class="col-1 text-right sort-col" data-sort="recv">Recv</div>
                        <div class="col-1 text-right sort-col" data-sort="total">Total</div>
                        <div class="col-protocol">Proto</div>
                    </div>
                    <div class="table-body">
                        ${sessions.map((s, i) => `
                            <div class="table-row ${i % 2 === 0 ? 'row-alt' : ''}" data-session="${s.id}">
                                <div class="col-2"><span class="src-ip">${s.src_ip}</span><span class="arrow">→</span><span class="dst-ip">${s.dst_ip}</span></div>
                                <div class="col-1 text-right">${formatBytes(s.sent_bytes)}</div>
                                <div class="col-1 text-right">${formatBytes(s.recv_bytes)}</div>
                                <div class="col-1 text-right font-bold">${formatBytes(s.total_bytes)}</div>
                                <div class="col-protocol"><span class="protocol-badge ${s.protocols[0].toLowerCase()}">${s.protocols[0]}</span></div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="panel right-panel">
                    <div class="panel-title" style="color:var(--accent-purple)">Top Traffic</div>
                    <div class="traffic-list">
                        ${getTopTraffic().map(item => `
                            <div class="traffic-item">
                                <span>${item.ip}${item.domain ? ` (${item.domain})` : ''}</span>
                                <span style="color:var(--accent-orange)">${formatBytes(item.bytes)}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="panel-title" style="margin-top:16px;color:var(--accent-blue)">Protocol Distribution</div>
                    <div class="protocol-bars">
                        ${getProtocolStats().map(p => `
                            <div class="protocol-bar-item">
                                <span class="protocol-name">${p.name}</span>
                                <div class="bar-bg"><div class="bar-fill ${p.name.toLowerCase()}" style="width:${p.percent}%"></div></div>
                                <span class="percent">${p.percent}%</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    bindEvents();
}

function renderSessionDetail(sessionId) {
    const session = sessions.find(s => s.id === sessionId);
    if (!session) { router.navigate('/'); return; }

    const app = document.getElementById('app');
    const duration = session.packets.length > 1 ?
        (session.packets[session.packets.length - 1].timestamp - session.packets[0].timestamp).toFixed(3) + 's' : '0s';

    app.innerHTML = `
        <div class="back-nav" id="back-nav">← Back to Sessions</div>

        <div class="session-header">
            <div class="session-title">
                <span class="src-ip">${session.src_ip}</span>
                <span style="color:var(--text-secondary)">↔</span>
                <span class="dst-ip">${session.dst_ip}</span>
                <span class="protocol-badge ${session.protocols[0].toLowerCase()}">${session.protocols[0]}</span>
            </div>
            <div class="session-stats">
                <span>Sent: <span style="color:var(--accent-blue)">${formatBytes(session.sent_bytes)}</span></span>
                <span>Recv: <span style="color:var(--accent-green)">${formatBytes(session.recv_bytes)}</span></span>
                <span>Packets: <span style="color:var(--accent-orange)">${session.packets.length}</span></span>
            </div>
        </div>

        <div class="summary-cards">
            <div class="card"><div class="card-label">Duration</div><div class="card-value accent-blue">${duration}</div></div>
            <div class="card"><div class="card-label">Avg Latency</div><div class="card-value accent-green">12ms</div></div>
            <div class="card"><div class="card-label">Retrans Rate</div><div class="card-value accent-purple">0.8%</div></div>
            <div class="card"><div class="card-label">TTL Avg</div><div class="card-value">64</div></div>
        </div>

        <div class="tabs">
            <div class="tab active">Packet List</div>
            <div class="tab">Timeline</div>
            <div class="tab">Request Trace</div>
            <div class="tab">Stats</div>
        </div>

        <div class="packet-table">
            <div class="table-header">
                <div class="col-num">#</div>
                <div class="col-time">Time</div>
                <div class="col-dir">Dir</div>
                <div class="col-proto">Proto</div>
                <div class="col-content">Content</div>
            </div>
            <div class="table-body">
                ${session.packets.slice(0, 50).map((p, i) => `
                    <div class="table-row ${i % 2 === 0 ? 'row-alt' : ''}">
                        <div class="col-num" style="color:var(--text-secondary)">${p.index + 1}</div>
                        <div class="col-time" style="color:var(--accent-blue)">${p.timestamp.toFixed(3)}</div>
                        <div class="col-dir"><span class="${p.src_ip === session.src_ip ? 'dir-out' : 'dir-in'}">${p.src_ip === session.src_ip ? '→' : '←'}</span></div>
                        <div class="col-proto">${p.protocol}</div>
                        <div class="col-content">${p.payload}</div>
                    </div>
                `).join('')}
                ${session.packets.length > 50 ? `<div style="padding:8px 12px;color:var(--text-secondary);text-align:center">... ${session.packets.length - 50} more packets</div>` : ''}
            </div>
        </div>
    `;

    document.getElementById('back-nav').addEventListener('click', () => router.navigate('/'));
}

function bindEvents() {
    const fileInput = document.getElementById('file-input');
    if (fileInput) {
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const buffer = await file.arrayBuffer();
                packets = parsePcap(buffer);
                sessions = aggregateSessions(packets);
                router.navigate('/');
            } catch (err) {
                alert('Error parsing pcap file: ' + err.message);
            }
        });
    }

    const uploadArea = document.getElementById('upload-area');
    if (uploadArea) {
        uploadArea.addEventListener('click', () => {
            document.getElementById('file-input').click();
        });
    }

    document.querySelectorAll('.table-row[data-session]').forEach(row => {
        row.addEventListener('click', () => {
            router.navigate('/session/' + encodeURIComponent(row.dataset.session));
        });
    });
}

// ==================== Init ====================
router.register('/', renderHome);
router.register('/session/:id', () => {
    const sessionId = decodeURIComponent(window.location.hash.split('/session/')[1]);
    renderSessionDetail(sessionId);
});

// Start
router.handleRoute();
    </script>
</body>
</html>
